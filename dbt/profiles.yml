# No secrets in this file: host, http_path and token come from environment variables.
# Load them before running dbt:  source ~/.databricks.env
# dbt finds this file because it looks in the current folder first (run dbt from dbt/).
project_x:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: workspace
      # Models land in project_x_staging, project_x_intermediate, project_x_marts, project_x_seeds
      schema: project_x
      threads: 4
