seeds:
  - name: country_regions
    description: Countries Northpeak ships to, with sales region, local currency and VAT rate. Owned by Finance.
    columns:
      - name: country_code
        description: ISO 3166-1 alpha-2 code.
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ["Nordics", "DACH", "Benelux"]

  - name: product_categories
    description: Category codes from the product catalogue mapped to readable names and departments. Owned by Merchandising.
    columns:
      - name: category_code
        data_tests: [unique, not_null]
      - name: department
        data_tests: [not_null]

  - name: currency_rates
    description: Monthly average exchange rates to EUR (ECB style), one row per currency and month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency, rate_month]
    columns:
      - name: rate_to_eur
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: campaigns
    description: Marketing campaigns with discount codes and budgets. Owned by Marketing.
    columns:
      - name: campaign_code
        data_tests: [unique, not_null]
